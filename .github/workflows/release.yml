name: Deploy versioned docs

on:
  # Sent by sqlc-dev/sqlc on release, with {"tag": "v1.32.0"} as payload.
  repository_dispatch:
    types: [docs-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'sqlc tag to build (e.g. v1.32.0)'
        required: true

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out sqlc docs at tag
        uses: actions/checkout@v4
        with:
          repository: sqlc-dev/sqlc
          ref: ${{ env.TAG }}
          path: .cache/sqlc
          sparse-checkout: docs

      # Versioning starts at the first tag that carries the plain-markdown
      # content contract; older tags are not backfilled.
      - name: Check content contract
        run: |
          if [ ! -f .cache/sqlc/docs/toc.yaml ]; then
            echo "::error::${TAG} predates docs/toc.yaml; nothing to build"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ingest
        run: node scripts/ingest.mjs --src .cache/sqlc/docs

      - name: Build
        run: npm run build
        env:
          # Static export bakes absolute asset/link/search paths, so the
          # version prefix must be set at build time. /en/vX.Y.Z matches the
          # old Read the Docs tag URLs.
          NEXT_PUBLIC_BASE_PATH: /en/${{ env.TAG }}

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ env.TAG }}
          path: out/
          retention-days: 7

      - name: Deploy to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 sync out/ "s3://${BUCKET}/en/${TAG}/" \
            --endpoint-url "$ENDPOINT" --delete --exclude "*.html/__next.*"
          aws s3 sync out-segments/ "s3://${BUCKET}/en/${TAG}/" \
            --endpoint-url "$ENDPOINT"

          # Append this version to versions.json at the domain root; every
          # snapshot fetches it at runtime, so old snapshots list new versions.
          aws s3 cp "s3://${BUCKET}/versions.json" versions.json \
            --endpoint-url "$ENDPOINT" || echo '{"versions":[]}' > versions.json
          node -e '
            const fs = require("fs");
            const file = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            const versions = new Set(file.versions ?? []);
            versions.add(process.argv[1]);
            const sorted = [...versions].sort((a, b) =>
              b.localeCompare(a, undefined, { numeric: true }));
            fs.writeFileSync("versions.json", JSON.stringify(
              { latest: sorted[0], versions: sorted }, null, 2) + "\n");
          ' "$TAG"
          aws s3 cp versions.json "s3://${BUCKET}/versions.json" \
            --endpoint-url "$ENDPOINT" --content-type application/json
